name: Backend Validation

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    paths:
      - "apps/backend/**"
      - ".github/workflows/backend-validation.yml"

jobs:
  backend-validation:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: lifelink
          POSTGRES_PASSWORD: lifelink
          POSTGRES_DB: lifelink
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U lifelink -d lifelink"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    defaults:
      run:
        working-directory: apps/backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q app alembic

      - name: Import FastAPI application
        env:
          PROJECT_NAME: LifeLink AI
          PROJECT_VERSION: "1.0.0"
          API_V1_PREFIX: /api/v1
          ENVIRONMENT: test
          DEBUG: "false"
          SECRET_KEY: lifelink-ci-secret
          ALGORITHM: HS256
          ACCESS_TOKEN_EXPIRE_MINUTES: "30"
          POSTGRES_SERVER: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_USER: lifelink
          POSTGRES_PASSWORD: lifelink
          POSTGRES_DB: lifelink
          REDIS_HOST: localhost
          REDIS_PORT: "6379"
        run: python -c "from app.main import app; assert app.title == 'LifeLink AI'; print('FastAPI import OK')"

      - name: Run Alembic migrations
        env:
          PROJECT_NAME: LifeLink AI
          PROJECT_VERSION: "1.0.0"
          API_V1_PREFIX: /api/v1
          ENVIRONMENT: test
          DEBUG: "false"
          SECRET_KEY: lifelink-ci-secret
          ALGORITHM: HS256
          ACCESS_TOKEN_EXPIRE_MINUTES: "30"
          POSTGRES_SERVER: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_USER: lifelink
          POSTGRES_PASSWORD: lifelink
          POSTGRES_DB: lifelink
          REDIS_HOST: localhost
          REDIS_PORT: "6379"
        run: alembic upgrade head

      - name: Run backend tests
        env:
          PROJECT_NAME: LifeLink AI
          PROJECT_VERSION: "1.0.0"
          API_V1_PREFIX: /api/v1
          ENVIRONMENT: test
          DEBUG: "false"
          SECRET_KEY: lifelink-ci-secret
          ALGORITHM: HS256
          ACCESS_TOKEN_EXPIRE_MINUTES: "30"
          POSTGRES_SERVER: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_USER: lifelink
          POSTGRES_PASSWORD: lifelink
          POSTGRES_DB: lifelink
          REDIS_HOST: localhost
          REDIS_PORT: "6379"
        run: pytest -q

      - name: Verify Alembic head
        env:
          PROJECT_NAME: LifeLink AI
          PROJECT_VERSION: "1.0.0"
          API_V1_PREFIX: /api/v1
          ENVIRONMENT: test
          DEBUG: "false"
          SECRET_KEY: lifelink-ci-secret
          ALGORITHM: HS256
          ACCESS_TOKEN_EXPIRE_MINUTES: "30"
          POSTGRES_SERVER: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_USER: lifelink
          POSTGRES_PASSWORD: lifelink
          POSTGRES_DB: lifelink
          REDIS_HOST: localhost
          REDIS_PORT: "6379"
        run: alembic current
