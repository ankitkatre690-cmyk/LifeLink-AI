name: Flutter Validation

on:
  pull_request:
    paths:
      - "apps/frontend/**"
      - ".github/workflows/flutter-validation.yml"
  push:
    branches:
      - main
      - "feature/flutter-*"

jobs:
  flutter-validation:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate platform scaffolding
        run: flutter create .

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
