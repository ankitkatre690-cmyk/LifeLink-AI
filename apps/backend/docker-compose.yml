services:
  postgres:
    image: postgres:16-alpine
    container_name: lifelink-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: lifelink
      POSTGRES_PASSWORD: lifelink_dev
      POSTGRES_DB: lifelink
    ports:
      - "5432:5432"
    volumes:
      - lifelink_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lifelink -d lifelink"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: lifelink-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - lifelink_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  lifelink_postgres_data:
  lifelink_redis_data:
